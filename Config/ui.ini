[Window]
WindowTitle=V200A Wind Sensor Data Logger & Calibration System
DefaultWidth=1200
DefaultHeight=800
StartupWindowState=Normal
RememberWindowState=true
TopMost=false

[Theme]
ThemeName=Light
AccentColor=#0078D4
FontName=Segoe UI
FontSize=11

[UI_Elements]
ShowStatusBar=true
ShowToolBar=true
ShowDataGrid=true
ShowCharts=true
ShowNotifications=true

[Charts]
ChartUpdateInterval=1000
ChartDataPoints=1000
ChartType=LineChart
EnableAnimation=true

[DataGrid]
EnableSorting=true
EnableFiltering=true
EnablePaging=true
PageSize=50
