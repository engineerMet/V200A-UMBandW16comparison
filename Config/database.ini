[Database]
ConnectionString=Data Source=./Data/sensordata.db;Version=3;
Provider=SQLite
Timeout=30
EnableEncryption=false
EncryptionKey=

[Tables]
SensorDataTable=SensorReadings
CalibrationTable=CalibrationHistory
SettingsTable=ApplicationSettings
LogsTable=SystemLogs

[Backup]
BackupPath=./Backups
BackupInterval=86400
KeepBackups=10
AutoRestore=true

[Migration]
AutoMigrate=true
MigrationPath=./Migrations
