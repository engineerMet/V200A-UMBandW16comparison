[Application]
Name=V200A Wind Sensor Data Logger
Version=1.0.0
Author=engineerMet
Description=Wind Sensor Data Logger & Calibration System

[Logging]
LogLevel=INFO
LogPath=./Logs
MaxLogFileSize=10485760
RetentionDays=30
EnableConsoleOutput=true

[Database]
ConnectionString=Data Source=./Data/sensordata.db
Provider=SQLite
AutoMigrate=true
BackupOnStartup=true

[Calibration]
AutoCalibrate=false
CalibrationInterval=3600
StandardTemperature=20.0
StandardPressure=1013.25

[Sensors]
DefaultSensorID=V200A
SamplingRate=1000
DataBufferSize=10000
EnableDataValidation=true
